<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <!-- Rich Golden Ocean & Warm Amber Gradients (Rising from Floor) -->
    <linearGradient id="backWaveGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFB347" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E28743" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="midWaveGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Main Vibrant Foreground Golden Swell -->
    <linearGradient id="frontWaveGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="25%" stop-color="#E28743" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FFB347" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="1"/>
    </linearGradient>

    <!-- Glowing White/Gold Crest Ridge -->
    <linearGradient id="crestRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E28743" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="whiteRimGlow">
      <feDropShadow dx="0" dy="-2" stdDeviation="5" flood-color="#FFD700" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Deep Dark Ocean Sky Background -->
  <rect width="900" height="200" fill="#0d1117"/>

  <!-- Top Signature Floating in the Dark Sky Above the Wave -->
  <text x="450" y="30" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">🥐 The Rolling Oven  •  Next.js 16 • Supabase PostgreSQL • GA4 Telemetry</text>
  <text x="450" y="50" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="600" fill="#E28743" text-anchor="middle">Engineered by Suganesan S (Sugan) • MBA in Business Analytics &amp; Marketing (BIT Sathy)</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: DEEP BACKGROUND SWELL (Rising from Bottom y=200)       -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#backWaveGold)" d="M0,200 L0,120 C150,70 300,140 450,80 C600,135 750,60 900,110 L900,200 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,200 L0,120 C150,70 300,140 450,80 C600,135 750,60 900,110 L900,200 Z;
              M0,200 L0,90 C150,135 300,75 450,120 C600,70 750,130 900,85 L900,200 Z;
              M0,200 L0,130 C150,80 300,130 450,75 C600,125 750,80 900,115 L900,200 Z;
              M0,200 L0,120 C150,70 300,140 450,80 C600,135 750,60 900,110 L900,200 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: MID-OCEAN WAVE SWELL (Rising from Bottom y=200)        -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#midWaveGold)" d="M0,200 L0,135 C180,85 360,150 540,90 C700,145 800,75 900,125 L900,200 Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,200 L0,135 C180,85 360,150 540,90 C700,145 800,75 900,125 L900,200 Z;
              M0,200 L0,105 C180,145 360,85 540,135 C700,85 800,135 900,95 L900,200 Z;
              M0,200 L0,140 C180,95 360,135 540,80 C700,130 800,90 900,120 L900,200 Z;
              M0,200 L0,135 C180,85 360,150 540,90 C700,145 800,75 900,125 L900,200 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: HUGE FOREGROUND GOLDEN RISING WAVE (From Reference)    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#frontWaveGold)" d="M0,200 L0,115 C90,65 190,80 260,135 C380,60 560,50 670,125 C760,85 840,110 900,195 L900,200 Z">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
      values="M0,200 L0,115 C90,65 190,80 260,135 C380,60 560,50 670,125 C760,85 840,110 900,195 L900,200 Z;
              M0,200 L0,85 C90,125 190,65 260,110 C380,85 560,75 670,105 C760,120 840,85 900,185 L900,200 Z;
              M0,200 L0,125 C90,75 190,95 260,130 C380,50 560,60 670,130 C760,75 840,120 900,190 L900,200 Z;
              M0,200 L0,115 C90,65 190,80 260,135 C380,60 560,50 670,125 C760,85 840,110 900,195 L900,200 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: GLOWING WHITE FOAM CREST RIDGE (Top of Arch)           -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="none" stroke="url(#crestRim)" stroke-width="3.5" filter="url(#whiteRimGlow)" d="M0,115 C90,65 190,80 260,135 C380,60 560,50 670,125 C760,85 840,110 900,195">
    <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
      values="M0,115 C90,65 190,80 260,135 C380,60 560,50 670,125 C760,85 840,110 900,195;
              M0,85 C90,125 190,65 260,110 C380,85 560,75 670,105 C760,120 840,85 900,185;
              M0,125 C90,75 190,95 260,130 C380,50 560,60 670,130 C760,75 840,120 900,190;
              M0,115 C90,65 190,80 260,135 C380,60 560,50 670,125 C760,85 840,110 900,195" />
  </path>
</svg>
