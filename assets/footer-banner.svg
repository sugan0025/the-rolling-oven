<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <!-- Ocean Wave Gradients (Filling Downward into the Ocean Floor) -->
    <linearGradient id="oceanBackF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFB347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E28743" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="oceanMidF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#E28743" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="oceanFrontF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FFB347" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#E28743" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="glowCrestF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFF8DC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="900" height="180" fill="#0d1117"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: DEEP BACKGROUND OCEAN SWELL (Fills to Bottom y=180)    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#oceanBackF)" d="M0,45 C150,15 300,65 450,25 C600,70 750,20 900,45 L900,180 L0,180 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,45 C150,15 300,65 450,25 C600,70 750,20 900,45 L900,180 L0,180 Z;
              M0,30 C150,60 300,20 450,55 C600,25 750,65 900,30 L900,180 L0,180 Z;
              M0,55 C150,25 300,70 450,30 C600,60 750,35 900,50 L900,180 L0,180 Z;
              M0,45 C150,15 300,65 450,25 C600,70 750,20 900,45 L900,180 L0,180 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: MID-OCEAN SWELL (Fills to Bottom y=180)                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#oceanMidF)" d="M0,60 C200,30 380,75 560,40 C720,70 820,35 900,55 L900,180 L0,180 Z">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="M0,60 C200,30 380,75 560,40 C720,70 820,35 900,55 L900,180 L0,180 Z;
              M0,45 C200,70 380,35 560,65 C720,35 820,65 900,45 L900,180 L0,180 Z;
              M0,65 C200,40 380,60 560,35 C720,65 820,40 900,60 L900,180 L0,180 Z;
              M0,60 C200,30 380,75 560,40 C720,70 820,35 900,55 L900,180 L0,180 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: FOREGROUND ROLLING OCEAN CREST (Fills to Bottom y=180) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#oceanFrontF)" d="M0,80 C120,50 240,95 360,60 C480,90 600,50 720,85 C810,60 870,95 900,75 L900,180 L0,180 Z">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M0,80 C120,50 240,95 360,60 C480,90 600,50 720,85 C810,60 870,95 900,75 L900,180 L0,180 Z;
              M0,65 C120,95 240,55 360,85 C480,55 600,85 720,60 C810,90 870,65 900,80 L900,180 L0,180 Z;
              M0,85 C120,60 240,80 360,55 C480,90 600,65 720,80 C810,55 870,85 900,70 L900,180 L0,180 Z;
              M0,80 C120,50 240,95 360,60 C480,90 600,50 720,85 C810,60 870,95 900,75 L900,180 L0,180 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: FOAM HIGHLIGHT CREST RIDGE                            -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="none" stroke="url(#glowCrestF)" stroke-width="3" d="M0,80 C120,50 240,95 360,60 C480,90 600,50 720,85 C810,60 870,95 900,75">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M0,80 C120,50 240,95 360,60 C480,90 600,50 720,85 C810,60 870,95 900,75;
              M0,65 C120,95 240,55 360,85 C480,55 600,85 720,60 C810,90 870,65 900,80;
              M0,85 C120,60 240,80 360,55 C480,90 600,65 720,80 C810,55 870,85 900,70;
              M0,80 C120,50 240,95 360,60 C480,90 600,50 720,85 C810,60 870,95 900,75" />
  </path>

  <!-- Footer Brand Text Floating Inside the Deep Ocean Body -->
  <text x="450" y="136" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">🥐 The Rolling Oven  •  Next.js 16 • Supabase PostgreSQL • GA4 Telemetry</text>
  <text x="450" y="158" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#FFD700" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">Engineered by Suganesan S (Sugan) • MBA in Business Analytics &amp; Marketing (BIT Sathy)</text>
</svg>
