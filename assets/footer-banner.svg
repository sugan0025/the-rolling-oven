<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <!-- Dramatic Amber & Golden Ocean Gradients -->
    <linearGradient id="hugeOceanBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#FFB347" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E28743" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="hugeOceanMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28743" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="hugeOceanFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="20%" stop-color="#E28743" stop-opacity="1"/>
      <stop offset="50%" stop-color="#FFB347" stop-opacity="1"/>
      <stop offset="80%" stop-color="#FFD700" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a1b27" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="foamWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="foamGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Ocean Void -->
  <rect width="900" height="240" fill="#0d1117"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 1: HUGE BACKGROUND TIDAL SWELL (Slow 7.5s)                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#hugeOceanBack)" d="M0,0 C150,130 300,15 450,110 C600,175 750,25 900,105 L900,0 L0,0 Z">
    <animate attributeName="d" dur="7.5s" repeatCount="indefinite"
      values="M0,0 C150,130 300,15 450,110 C600,175 750,25 900,105 L900,0 L0,0 Z;
              M0,0 C150,35 300,150 450,45 C600,130 750,165 900,40 L900,0 L0,0 Z;
              M0,0 C150,145 300,50 450,155 C600,45 750,105 900,135 L900,0 L0,0 Z;
              M0,0 C150,130 300,15 450,110 C600,175 750,25 900,105 L900,0 L0,0 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 2: HUGE MID-OCEAN WAVE SURGE (Medium 5.5s)                -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#hugeOceanMid)" d="M0,0 C180,95 360,175 540,80 C700,15 800,140 900,70 L900,0 L0,0 Z">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="M0,0 C180,95 360,175 540,80 C700,15 800,140 900,70 L900,0 L0,0 Z;
              M0,0 C180,165 360,55 540,150 C700,105 800,30 900,135 L900,0 L0,0 Z;
              M0,0 C180,45 360,145 540,50 C700,140 800,95 900,55 L900,0 L0,0 Z;
              M0,0 C180,95 360,175 540,80 C700,15 800,140 900,70 L900,0 L0,0 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 3: TOWERING FOREGROUND OCEAN BREAKER (Fast 4s surge)      -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="url(#hugeOceanFront)" d="M0,0 C120,150 240,30 360,135 C480,195 600,60 720,165 C810,210 870,95 900,130 L900,0 L0,0 Z">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M0,0 C120,150 240,30 360,135 C480,195 600,60 720,165 C810,210 870,95 900,130 L900,0 L0,0 Z;
              M0,0 C120,65 240,175 360,75 C480,140 600,185 720,85 C810,135 870,175 900,100 L900,0 L0,0 Z;
              M0,0 C120,165 240,85 360,175 C480,65 600,120 720,185 C810,85 870,65 900,150 L900,0 L0,0 Z;
              M0,0 C120,150 240,30 360,135 C480,195 600,60 720,165 C810,210 870,95 900,130 L900,0 L0,0 Z" />
  </path>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- LAYER 4: GLOWING FOAM SPRAY CREST LINE                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <path fill="none" stroke="url(#foamWhite)" stroke-width="4" filter="url(#foamGlow)" d="M0,0 C120,150 240,30 360,135 C480,195 600,60 720,165 C810,210 870,95 900,130">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M0,0 C120,150 240,30 360,135 C480,195 600,60 720,165 C810,210 870,95 900,130;
              M0,0 C120,65 240,175 360,75 C480,140 600,185 720,85 C810,135 870,175 900,100;
              M0,0 C120,165 240,85 360,175 C480,65 600,120 720,185 C810,85 870,65 900,150;
              M0,0 C120,150 240,30 360,135 C480,195 600,60 720,165 C810,210 870,95 900,130" />
  </path>

  <!-- Footer Brand Text & Engineering Signature (Floating at bottom center) -->
  <text x="450" y="200" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">🥐 The Rolling Oven  •  Next.js 16 • Supabase PostgreSQL • GA4 Telemetry</text>
  <text x="450" y="222" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700" fill="#FFD700" text-anchor="middle">Engineered by Suganesan S (Sugan) • MBA in Business Analytics &amp; Marketing (BIT Sathy)</text>
</svg>
