<svg xmlns="http://www.w3.org/2000/svg" width="900" height="130" viewBox="0 0 900 130">
  <defs>
    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1b27;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#E28743;stop-opacity:0.85"/>
      <stop offset="50%" style="stop-color:#FFB347;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#E28743;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes waveMotionFooter {
      0% { d: path("M0,0 C200,45 400,10 600,40 C750,60 850,20 900,30 L900,0 L0,0 Z"); }
      50% { d: path("M0,0 C200,15 400,45 600,20 C750,35 850,55 900,25 L900,0 L0,0 Z"); }
      100% { d: path("M0,0 C200,45 400,10 600,40 C750,60 850,20 900,30 L900,0 L0,0 Z"); }
    }
    .animated-wave-footer {
      animation: waveMotionFooter 7s ease-in-out infinite;
    }
  </style>

  <rect width="900" height="130" fill="#0d1117"/>
  <path d="M0,0 C200,45 400,10 600,40 C750,60 850,20 900,30 L900,0 L0,0 Z" fill="url(#footerWave)" class="animated-wave-footer"/>
  
  <text x="450" y="82" font-family="'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">🥐 The Rolling Oven  •  Next.js 16 • Supabase PostgreSQL • GA4 Telemetry</text>
  <text x="450" y="104" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" fill="#E28743" text-anchor="middle">Engineered by Suganesan S (Sugan) • MBA in Business Analytics &amp; Marketing (BIT Sathy)</text>
</svg>
