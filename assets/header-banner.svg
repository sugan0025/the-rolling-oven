<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="25%" stop-color="#E28743" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFB347">
        <animate attributeName="stop-color" values="#FFB347;#FFD700;#FFA07A;#FFB347" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#E28743" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#FFD700">
        <animate attributeName="stop-color" values="#FFD700;#FFA500;#FFD700" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="goldGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB347" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="210" fill="url(#headerBg)"/>

  <!-- Decorative Grid Lines -->
  <line x1="0" y1="50" x2="900" y2="50" stroke="#30363d" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="0" y1="100" x2="900" y2="100" stroke="#30363d" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="0" y1="150" x2="900" y2="150" stroke="#30363d" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Main Title -->
  <text x="450" y="80" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="44" font-weight="800" fill="url(#textGold)" text-anchor="middle" filter="url(#goldGlow)">🥐 The Rolling Oven</text>

  <!-- Subtitle -->
  <text x="450" y="115" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="600" fill="#E28743" text-anchor="middle" letter-spacing="1">HIGH-PERFORMANCE D2C STOREFRONT &amp; GROWTH ENGINE</text>

  <!-- Tagline Badges Text -->
  <text x="450" y="144" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Next.js 16 SSG &lt;900ms  •  Supabase PostgreSQL Ledger  •  GA4 E-Commerce Telemetry</text>

  <!-- SMIL Animated Bottom Wave Curve (Guaranteed native GitHub Camo Animation) -->
  <path fill="url(#waveGrad)" d="M0,175 C150,195 300,160 450,180 C600,200 750,165 900,185 L900,210 L0,210 Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0,175 C150,195 300,160 450,180 C600,200 750,165 900,185 L900,210 L0,210 Z;
              M0,185 C150,165 300,195 450,165 C600,185 750,195 900,175 L900,210 L0,210 Z;
              M0,175 C150,195 300,160 450,180 C600,200 750,165 900,185 L900,210 L0,210 Z" />
  </path>
</svg>
