<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a1b27;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="25%" style="stop-color:#E28743;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#FFB347;stop-opacity:1"/>
      <stop offset="75%" style="stop-color:#E28743;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1a1b27;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <filter id="goldGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFB347" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes waveMotion {
      0% { d: path("M0,175 C150,195 300,160 450,180 C600,200 750,165 900,185 L900,210 L0,210 Z"); }
      50% { d: path("M0,185 C150,165 300,195 450,170 C600,185 750,195 900,175 L900,210 L0,210 Z"); }
      100% { d: path("M0,175 C150,195 300,160 450,180 C600,200 750,165 900,185 L900,210 L0,210 Z"); }
    }
    .animated-wave {
      animation: waveMotion 6s ease-in-out infinite;
    }
    @keyframes pulseTitle {
      0% { filter: drop-shadow(0 4px 6px rgba(226, 135, 67, 0.3)); }
      100% { filter: drop-shadow(0 4px 14px rgba(255, 179, 71, 0.7)); }
    }
    .pulsing-title {
      animation: pulseTitle 3s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="210" fill="url(#headerBg)"/>

  <!-- Decorative Grid Lines -->
  <line x1="0" y1="50" x2="900" y2="50" stroke="#30363d" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="0" y1="100" x2="900" y2="100" stroke="#30363d" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="0" y1="150" x2="900" y2="150" stroke="#30363d" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Main Title with Pulsing Glow -->
  <text x="450" y="80" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="44" font-weight="800" fill="url(#textGold)" text-anchor="middle" class="pulsing-title">🥐 The Rolling Oven</text>

  <!-- Subtitle -->
  <text x="450" y="115" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="600" fill="#E28743" text-anchor="middle" letter-spacing="1">HIGH-PERFORMANCE D2C STOREFRONT &amp; GROWTH ENGINE</text>

  <!-- Tagline Badges Text -->
  <text x="450" y="144" font-family="'Segoe UI',Roboto,-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Next.js 16 SSG &lt;900ms  •  Supabase PostgreSQL Ledger  •  GA4 E-Commerce Telemetry</text>

  <!-- Animated Bottom Wave Curve -->
  <path d="M0,175 C150,195 300,160 450,180 C600,200 750,165 900,185 L900,210 L0,210 Z" fill="url(#waveGrad)" class="animated-wave"/>
</svg>
