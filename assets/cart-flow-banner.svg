<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="borderFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E28743;stop-opacity:0.95"/>
      <stop offset="35%" style="stop-color:#FFB347;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#3ECF8E;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#58A6FF;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="shadowFlow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E28743" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Card Base -->
  <rect x="2" y="2" width="896" height="176" rx="16" ry="16" fill="none" stroke="url(#borderFlow)" stroke-width="2" filter="url(#shadowFlow)"/>
  <rect x="4" y="4" width="892" height="172" rx="14" ry="14" fill="#0d1117" fill-opacity="0.92"/>
  <rect x="4" y="4" width="892" height="172" rx="14" ry="14" fill="#1e1610" fill-opacity="0.4"/>

  <!-- Section Title -->
  <text x="30" y="32" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFB347">🛒 END-TO-END D2C COMMERCE &amp; REAL-TIME ORDER PIPELINE</text>
  <line x1="30" y1="42" x2="870" y2="42" stroke="#30363d" stroke-width="1"/>

  <!-- Step 1: Browse & Cart -->
  <g transform="translate(30, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#E28743" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#E28743"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">1</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">🥐</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Select &amp; Add Cart</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">view_item_list • SSG</text>
  </g>

  <!-- Arrow 1 -->
  <text x="190" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#E28743" text-anchor="middle">➔</text>

  <!-- Step 2: Rate Limit & Zod -->
  <g transform="translate(205, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#f85149"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">2</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">🛡️</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Edge Security</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">IP Rate Limit • Honeypot</text>
  </g>

  <!-- Arrow 2 -->
  <text x="365" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#f85149" text-anchor="middle">➔</text>

  <!-- Step 3: Zero-Trust Price Engine -->
  <g transform="translate(380, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#FFD700" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#FFD700"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">3</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">⚖️</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Server Price Check</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">products.ts SSOT Recalc</text>
  </g>

  <!-- Arrow 3 -->
  <text x="540" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#FFD700" text-anchor="middle">➔</text>

  <!-- Step 4: Supabase Ledger -->
  <g transform="translate(555, 56)">
    <rect x="0" y="0" width="145" height="100" rx="10" fill="#161b22" stroke="#3ecf8e" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#3ecf8e"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">4</text>
    <text x="75" y="44" font-size="22" text-anchor="middle">💾</text>
    <text x="75" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL Record</text>
    <text x="75" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Supabase Order Audit</text>
  </g>

  <!-- Arrow 4 -->
  <text x="715" y="112" font-family="'Segoe UI',Roboto,sans-serif" font-size="16" fill="#3ecf8e" text-anchor="middle">➔</text>

  <!-- Step 5: Dual Dispatch & Delivery -->
  <g transform="translate(730, 56)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#58a6ff"/>
    <text x="20" y="24" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="800" fill="#0d1117" text-anchor="middle">5</text>
    <text x="70" y="44" font-size="22" text-anchor="middle">📦</text>
    <text x="70" y="68" font-family="'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Dual Email Proxy</text>
    <text x="70" y="84" font-family="'Segoe UI',Roboto,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Receipt + Owner Alert</text>
  </g>
</svg>
