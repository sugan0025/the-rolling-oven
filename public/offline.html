<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — The Rolling Oven</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #1A0F08;
      color: #FDF5E6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      max-width: 480px;
      width: 100%;
      background: rgba(28, 16, 8, 0.85);
      border: 1px solid rgba(201, 169, 110, 0.25);
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .offline-icon {
      font-size: 54px;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px;
      color: #FDF5E6;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    h1 span {
      color: #C9A96E;
    }
    p {
      color: #C4A882;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #C9A96E 0%, #D4944C 100%);
      color: #1A0F08;
      border: none;
      box-shadow: 0 4px 14px rgba(201, 169, 110, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 169, 110, 0.4);
    }
    .btn-secondary {
      background: rgba(201, 169, 110, 0.1);
      color: #C9A96E;
      border: 1px solid rgba(201, 169, 110, 0.3);
    }
    .btn-secondary:hover {
      background: rgba(201, 169, 110, 0.18);
    }
    .bakery-note {
      margin-top: 24px;
      font-size: 13px;
      color: #9E8468;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">🥖</div>
    <h1>Oven's Ready, But You're <span>Offline</span></h1>
    <p>
      It looks like your internet connection went for a break. Check your Wi-Fi or mobile data to continue exploring our handcrafted treats.
    </p>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="window.location.reload()">
        Try Again
      </button>
      <a href="tel:+919876543210" class="btn btn-secondary">
        Call The Bakery Direct
      </a>
    </div>
    <div class="bakery-note">
      The Rolling Oven — Sathyamangalam, Erode, Tamil Nadu
    </div>
  </div>
</body>
</html>
